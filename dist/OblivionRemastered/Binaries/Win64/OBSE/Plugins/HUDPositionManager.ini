; HUD Position Manager for Oblivion - settings. The settings page in Apocrypha Menu Framework writes this file;
; edit it by hand only with the game closed. fX / fY are a percentage of the screen's width / height (the same layout
; on every resolution); fScale 1.00 = the game's size.

[General]
; Apply my layout: 0 puts every element back where the game places it.
bEnabled=1
; HUD visibility: 0 = the game decides (the bars fade out when full), 1 = the bars stay shown while you play.
bAlwaysVisible=0
; Snap art edges together: 1 = an edge of a widget you move pulls onto a nearby edge of another widget you have placed; 0 = widgets sit where the sliders put them.
bSnapEdges=0
; Snap distance: how close an edge has to come before it snaps, in screen units (the screen is 1080 tall).
fSnapDistance=6
; Show every element: 1 = event-only elements are made to show, in the menu and out of it, until turned off (for laying them out); 0 = the HUD shows only what the game shows.
bPreview=0
; HUD widget collision: 1 = a widget you move stops where its edge meets another widget you have placed (a game-placed one is never in the way); 0 = widgets may overlap.
bWidgetCollision=0

[Health]
fX=0
fY=0
fScale=1.00
fLength=1.00
fHeight=1.00
bHide=0
bAlwaysVisible=0
sMoveWith=
; Fill from: 0 = the game's own, 1 = left, 2 = centre, 3 = right - the side the filled part is anchored to.
iFill=0
; Length follows the resource: 1 = the bar's length grows with your maximum; it is 1.00x long at fPointsPerLength points.
bLinkLength=0
fPointsPerLength=100
; Grows toward: 0 = both sides (about the centre), 1 = the right (anchored left), 2 = the left (anchored right).
iGrow=0

